name: Build VST3
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSMTG_RUN_VST_VALIDATOR=ON
      - name: Build and validate VST3
        run: cmake --build build --config Release --parallel
      - name: Test DSP
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: ANKS-Fragment-Engine-${{ matrix.os }}
          path: build/VST3/Release/
          if-no-files-found: error

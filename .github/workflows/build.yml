name: Build VST3
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lire le numéro de version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path CMakeLists.txt -Pattern 'project\([A-Za-z0-9_]+ VERSION ([0-9.]+)'
          $version = $match.Matches[0].Groups[1].Value
          $exists = git tag --list "v$version"
          $publish = (-not $exists) -and ('${{ github.event_name }}' -ne 'pull_request') -and ('${{ github.ref }}' -eq 'refs/heads/main')
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version - publication : $publish"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSMTG_RUN_VST_VALIDATOR=ON
      - name: Build and validate VST3
        run: cmake --build build --config Release --parallel
      - name: Test DSP
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: ANKS-Fragment-Engine-${{ matrix.os }}
          path: build/VST3/Release/
          if-no-files-found: error
      - name: Préparer le ZIP numéroté
        if: steps.version.outputs.publish == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "FRAGMENT-ENGINE-Windows-x64-${{ steps.version.outputs.version }}"
          $dir = "release/$name"
          New-Item -ItemType Directory -Force "$dir/VST3","$dir/Application" | Out-Null
          Get-ChildItem build -Recurse -Directory -Filter *.vst3 | Where-Object { $_.FullName -match '\\(Release\\VST3|VST3\\Release)\\[^\\]+\.vst3$' } | ForEach-Object { Copy-Item $_.FullName "$dir/VST3/" -Recurse -Force }
          if (-not (Get-ChildItem "$dir/VST3")) { throw "Aucun VST3 trouvé dans build" }
          Copy-Item README.md "$dir/"
          Compress-Archive -Path $dir -DestinationPath "release/$name.zip" -Force
          Get-ChildItem release
      - name: Publier la version (onglet Releases)
        if: steps.version.outputs.publish == 'true' && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Fragment Engine ${{ steps.version.outputs.version }}
          prerelease: true
          files: release/*.zip
          body: |
            **Fragment Engine — effet stutter / répétitions — ANKS Labs, gratuit.** Version de test : à essayer, pas encore une version finale.

            1. Télécharge `FRAGMENT-ENGINE-Windows-x64-${{ steps.version.outputs.version }}.zip` ci-dessous (rubrique *Assets*) et fais clic droit → **Extraire tout**.
            2. **Plugin pour Ableton** : copie le dossier `VST3\ANKS Fragment Engine.vst3` dans `C:\Program Files\Common Files\VST3`.
            3. Dans Live : **Préférences → Plug-ins → Dossier système VST3 = On**, puis **Relancer l'analyse**. Le plugin apparaît sous **Plug-ins**.

            C'est un **effet audio** : glisse-le sur une piste audio ou sur une batterie.

            *Windows peut afficher « Windows a protégé votre ordinateur » : Informations complémentaires → Exécuter quand même (programme gratuit non signé).*

            **EN —** Download `FRAGMENT-ENGINE-Windows-x64-${{ steps.version.outputs.version }}.zip`, extract it and copy `VST3\ANKS Fragment Engine.vst3` to `C:\Program Files\Common Files\VST3`, then rescan plug-ins in your DAW.
